# The Pocket-Studio link over one Ethernet cable, no router: every wired connection also takes an IPv4
# link-local address (169.254.x.x), so the two boxes reach each other; with a router, DHCP's address as well.
# (install.sh puts this in /etc/NetworkManager/conf.d/; 3 = enabled: NetworkManager reads a number here.)
# DHCP is waited for without end (2147483647: NetworkManager's "infinity"): on a cable no DHCP server ever
# answers, and a connection given up on (45 s by default) would take its link-local address down with it.
[connection-fm1-ethernet-link]
match-device=type:ethernet
ipv4.link-local=3
ipv4.dhcp-timeout=2147483647
